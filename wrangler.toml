name = "paytrack"
compatibility_date = "2024-11-01"
main = "src/index.js"

[assets]
directory = "public"

# ใช้สำหรับ `wrangler dev` ตอนพัฒนาในเครื่อง (ต้องมี Node.js/npm ติดตั้งก่อน)
# database_id ด้านล่างต้องแทนที่ด้วยค่าจริงหลังสร้าง D1 database
# (สร้างได้ทั้งจาก dash.cloudflare.com หรือคำสั่ง `wrangler d1 create paytrack-db`)
[[d1_databases]]
binding = "DB"
database_name = "paytrack-db"
database_id = "82464f02-68f9-4eca-a49f-a09f0d6b13f6"
